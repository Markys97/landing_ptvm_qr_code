<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTVEM - Prends Ta Vie En Main</title>
    <style>
      /* RESET & VARIABLES */
      :root {
        --noir: #000000;
        --blanc: #ffffff;
        --blanc-pure: #ffffff;
        --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Arial", sans-serif;
        background: var(--noir);
        color: var(--blanc);
        overflow-x: hidden;
        line-height: 1.6;
      }

      /* HERO SECTION - MOBILE FIRST */
      .hero {
        min-height: 100vh;
        background: var(--noir);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .hero-content {
        text-align: center;
        z-index: 2;
        padding: 0 1.5rem;
        width: 100%;
        max-width: 1200px;
      }

      /* LOGO CONTAINER */
      .logo-container {
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeIn 1s ease-out 0.5s forwards;
      }

      /* LOGO PTVEM - STYLE EXACT COMME L'IMAGE */
      .logo-ptvem {
        font-family: "Arial Black", "Helvetica Neue", sans-serif;
        font-size: 5rem;
        font-weight: 900;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
        position: relative;
        display: inline-block;
        color: var(--blanc-pure);
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5),
          0 0 20px rgba(255, 255, 255, 0.3), 0 0 30px rgba(255, 255, 255, 0.2);
      }

      .logo-ptvem .letter {
        display: inline-block;
        position: relative;
        animation: waterDrop 1.2s ease-out forwards;
        opacity: 0;
        transform: translateY(10px) scale(0.9);
      }

      .logo-ptvem .letter:nth-child(1) {
        animation-delay: 0.6s;
      }
      .logo-ptvem .letter:nth-child(2) {
        animation-delay: 0.7s;
      }
      .logo-ptvem .letter:nth-child(3) {
        animation-delay: 0.8s;
      }
      .logo-ptvem .letter:nth-child(4) {
        animation-delay: 0.9s;
      }
      .logo-ptvem .letter:nth-child(5) {
        animation-delay: 1s;
      }

      /* EFFET DE GOUTTE D'EAU SUR LES LETTRES */
      .logo-ptvem .letter::after {
        content: "";
        position: absolute;
        top: -5px;
        left: -5px;
        right: -5px;
        bottom: -5px;
        background: linear-gradient(
          45deg,
          transparent 30%,
          rgba(255, 255, 255, 0.1) 50%,
          transparent 70%
        );
        border-radius: 50% 20% 50% 30%;
        opacity: 0;
        animation: waterReflect 3s ease-in-out infinite;
        z-index: -1;
      }

      .logo-ptvem .letter:nth-child(1)::after {
        animation-delay: 0.1s;
      }
      .logo-ptvem .letter:nth-child(2)::after {
        animation-delay: 0.3s;
      }
      .logo-ptvem .letter:nth-child(3)::after {
        animation-delay: 0.5s;
      }
      .logo-ptvem .letter:nth-child(4)::after {
        animation-delay: 0.7s;
      }
      .logo-ptvem .letter:nth-child(5)::after {
        animation-delay: 0.9s;
      }

      /* SLOGAN - STYLE EXACT COMME L'IMAGE */
      .logo-slogan {
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--blanc-pure);
        position: relative;
        opacity: 0;
        animation: fadeInUp 0.8s ease-out 1.2s forwards;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.3),
          0 0 10px rgba(255, 255, 255, 0.2);
      }

      /* EFFET DE LUMIÈRE PULSÉE */
      .light-pulse {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
        animation: pulse 4s ease-in-out infinite;
        opacity: 0;
      }

      /* CTA BUTTON */
      .cta-button {
        display: inline-block;
        padding: 1rem 2.5rem;
        background: transparent;
        color: var(--blanc);
        border: 1px solid rgba(255, 255, 255, 0.3);
        text-decoration: none;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: var(--transition);
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 1s ease-out 1.5s forwards;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .cta-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transition: var(--transition);
      }

      .cta-button:hover {
        border-color: rgba(255, 255, 255, 0.6);
        transform: translateY(-2px);
      }

      .cta-button:hover::before {
        left: 100%;
      }

      /* ANIMATIONS KEYFRAMES */
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes waterDrop {
        0% {
          opacity: 0;
          transform: translateY(10px) scale(0.9);
          text-shadow: 0 0 0 rgba(255, 255, 255, 0);
        }
        50% {
          transform: translateY(-5px) scale(1.05);
          text-shadow: 0 5px 15px rgba(255, 255, 255, 0.4);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          text-shadow: 0 0 10px rgba(255, 255, 255, 0.5),
            0 0 20px rgba(255, 255, 255, 0.3), 0 0 30px rgba(255, 255, 255, 0.2);
        }
      }

      @keyframes waterReflect {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 0.3;
          transform: scale(1.1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.8);
        }
        50% {
          opacity: 0.1;
          transform: translate(-50%, -50%) scale(1.2);
        }
      }

      /* SCROLL INDICATOR */
      .scroll-indicator {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        animation: fadeIn 1s ease-out 2s forwards;
      }

      .scroll-arrow {
        width: 1px;
        height: 30px;
        background: rgba(255, 255, 255, 0.5);
        margin: 0 auto;
        position: relative;
        animation: bounce 2s infinite;
      }

      .scroll-arrow::after {
        content: "";
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        width: 6px;
        height: 6px;
        border-right: 1px solid rgba(255, 255, 255, 0.5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      }

      @keyframes bounce {
        0%,
        20%,
        50%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-8px);
        }
        60% {
          transform: translateY(-4px);
        }
      }

      /* RESPONSIVE */
      @media (min-width: 768px) {
        .logo-ptvem {
          font-size: 6rem;
        }

        .logo-slogan {
          font-size: 1.3rem;
          letter-spacing: 5px;
        }
      }

      @media (min-width: 1024px) {
        .logo-ptvem {
          font-size: 7rem;
        }

        .logo-slogan {
          font-size: 1.4rem;
          letter-spacing: 6px;
        }
      }
    </style>
  </head>
  <body>
    <!-- HERO SECTION -->
    <section class="hero">
      <div class="light-pulse"></div>

      <div class="hero-content">
        <div class="logo-container">
          <!-- Logo PTVEM exactement comme sur l'image -->
          <div class="logo-ptvem">
            <span class="letter">P</span>
            <span class="letter">T</span>
            <span class="letter">V</span>
            <span class="letter">E</span>
            <span class="letter">M</span>
          </div>

          <!-- Slogan exactement comme sur l'image -->
          <div class="logo-slogan">PRENDS TA VIE EN MAIN</div>
        </div>

        <a href="#manifeste" class="cta-button">Découvrir le manifeste</a>
      </div>

      <div class="scroll-indicator">
        <div class="scroll-arrow"></div>
      </div>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const letters = document.querySelectorAll(".logo-ptvem .letter");
        const ctaButton = document.querySelector(".cta-button");

        // Effet de survol sur les lettres
        letters.forEach((letter) => {
          letter.addEventListener("mouseenter", function () {
            this.style.transform = "scale(1.05)";
            this.style.transition = "transform 0.3s ease";
          });

          letter.addEventListener("mouseleave", function () {
            this.style.transform = "scale(1)";
          });
        });

        // Animation du bouton CTA
        ctaButton.addEventListener("mouseenter", function () {
          this.style.transform = "translateY(-2px)";
          this.style.borderColor = "rgba(255, 255, 255, 0.6)";
        });

        ctaButton.addEventListener("mouseleave", function () {
          this.style.transform = "translateY(0)";
          this.style.borderColor = "rgba(255, 255, 255, 0.3)";
        });
      });
    </script>
  </body>
</html>
